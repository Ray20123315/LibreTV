name: LibreTV production HTTP smoke test
on:
  push:
    branches:
      - verify/cloudflare-smoke-20261023
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify HTTP status, version, and access guard
        shell: bash
        run: |
          set -euo pipefail
          for ROOT in "https://libretv-latest.ray20123315.workers.dev" "https://libretv.ray2026.dpdns.org"; do
            echo "Verifying: $ROOT"
            curl --fail --silent --show-error --max-time 30 --retry 3 --retry-delay 2 "$ROOT/api/status" -o status.json
            jq -e '.version == "2.21.0" and .passwordRequired == true' status.json
            curl --fail --silent --show-error --max-time 30 --retry 3 --retry-delay 2 "$ROOT/" -o homepage.html
            grep -Eqi '(LibreTV|libretv)' homepage.html
            code="$(curl --silent --show-error --max-time 30 -o unauthorized.json -w '%{http_code}' -X POST -H 'content-type: application/json' --data '{"wd":"verification","sources":[]}' "$ROOT/api/search")"
            test "$code" = "401"
            echo "SMOKE_PASS: $ROOT has version 2.21.0, password enabled, homepage, unauthorized search returns 401"
          done
